# Builds OOMPAS Box for Windows and Mac and publishes a GitHub release whenever the version in
# desktop/package.json changes on main (and there's no release for it yet). So a release is:
#   bump "version" in desktop/package.json, add notes to CHANGES.md, commit, push.
# The installed apps pick the release up through their update check.
name: Release

on:
  push:
    branches: [main]
    paths: [desktop/package.json]
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_STATIC: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release $v already exists"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: version
    if: needs.version.outputs.exists != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: --win nsis --x64
          - os: macos-latest
            target: --mac zip --x64 --arm64 -c.mac.identity=-
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Get FFmpeg
        run: |
          get() { mkdir -p "ffmpeg/$2"; curl -fsSL "$FFMPEG_STATIC/$1.gz" | gunzip > "ffmpeg/$2/$3"; chmod +x "ffmpeg/$2/$3"; }
          if [ "$RUNNER_OS" = Windows ]; then get ffmpeg-win32-x64 win-x64 ffmpeg.exe
          else get ffmpeg-darwin-x64 mac-x64 ffmpeg; get ffmpeg-darwin-arm64 mac-arm64 ffmpeg; fi
      - run: npm ci
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/*.zip
            desktop/dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release notes from CHANGES.md
        run: |
          v="$VERSION"
          awk -v h="## OOMPAS Box $v" '$0==h{on=1;next} /^## /{if(on)exit} on' CHANGES.md > notes.md
          [ -s notes.md ] || echo "OOMPAS Box $v" > notes.md
          ls -la out; cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: OOMPAS Box ${{ needs.version.outputs.version }}
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: out/*
          make_latest: true
