<!doctype html>
<meta charset="utf-8">
<title>OOMPAS Box</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; opacity: .55; }
  .t { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
       font: 600 3vh "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #bdeee6; }
  .t b { font: italic 900 9vh Georgia, serif; color: #fff; text-shadow: .5vh .5vh 0 #3b6f8f; }
  .t span { background: rgba(14,61,71,.85); padding: .6vh 2vh; letter-spacing: .3em; }
</style>
<canvas width="160" height="120"></canvas>
<div class="t"><b>OOMPAS BOX</b><span>WARMING UP</span></div>
<script>
  const c = document.querySelector('canvas'), x = c.getContext('2d'), img = x.createImageData(160, 120), d = img.data;
  (function draw() { for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } x.putImageData(img, 0, 0); requestAnimationFrame(draw); })();
</script>
